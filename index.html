<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Earn Rewards</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#0f172a;
color:white;
}

.hidden{
display:none;
}

.container{
max-width:1100px;
margin:auto;
padding:25px;
}

.card{
background:#020617;
padding:25px;
border-radius:16px;
box-shadow:0 20px 60px rgba(0,0,0,.5);
}

h1,h2,h3{
margin-top:0;
}

input{
width:100%;
padding:14px;
border-radius:10px;
border:none;
margin-top:10px;
font-size:15px;
}

button{
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.loginBtn{
width:100%;
margin-top:10px;
background:#22c55e;
}

.balanceBox{
display:flex;
justify-content:space-between;
background:#020617;
padding:20px;
border-radius:14px;
margin-bottom:20px;
}

.balance{
font-size:26px;
color:#22c55e;
}

.offer-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:16px;
}

.offer{
background:#020617;
padding:20px;
border-radius:14px;
border:1px solid #1f2937;
text-align:center;
transition:.2s;
}

.offer:hover{
transform:translateY(-4px);
border-color:#2563eb;
}

.offer button{
background:#2563eb;
width:100%;
margin-top:10px;
}

iframe{
width:100%;
height:100vh;
border:none;
}

.backBtn{
background:#ef4444;
padding:10px 20px;
margin:10px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:22px;
font-weight:bold;
color:#22c55e;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="container">

<div class="card">

<h2>Login</h2>

<input id="username" placeholder="Enter username">

<button class="loginBtn" onclick="enter()">Start Earning</button>

</div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="container hidden">

<div class="header">

<div class="logo">
💰 EarnRewards
</div>

<div>
User: <span id="user"></span>
</div>

</div>

<div class="balanceBox">

<div>

Balance  
<div class="balance">$<span id="balance"></span></div>

</div>

<button onclick="addDaily()">Daily Bonus</button>

</div>


<h2>Offerwalls</h2>

<div class="offer-grid">

<div class="offer">
<h3>Gemiwall</h3>
<p>Surveys • Apps • Games</p>
<button onclick="openGemi()">Open</button>
</div>

<div class="offer">
<h3>Revtoo</h3>
<p>Offers • Apps</p>
<button onclick="openRevtoo()">Open</button>
</div>

<div class="offer">
<h3>Clickwall</h3>
<p>Surveys • Apps</p>
<button onclick="openClickwall()">Open</button>
</div>

<div class="offer">
<h3>MoustacheLeads</h3>
<p>Offers • Surveys</p>
<button onclick="openMoustache()">Open</button>
</div>

</div>

</div>


<!-- OFFERWALL VIEW -->

<div id="offerView" class="hidden">

<button class="backBtn" onclick="back()">← Back</button>

<iframe id="frame"></iframe>

</div>



<script>

const REVTOO_API_KEY="7y9n22mjsz0c3ujyncuomz95k6p31p";


function enter(){

const name=document.getElementById("username").value.trim();

if(!name){

alert("Enter username");

return;

}

localStorage.setItem("user",name);

if(!localStorage.getItem("balance")){

localStorage.setItem("balance","0.50");

}

showDashboard();

}


function showDashboard(){

const user=localStorage.getItem("user");

if(!user)return;

document.getElementById("login").classList.add("hidden");

document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("user").innerText=user;

document.getElementById("balance").innerText=localStorage.getItem("balance");

}


function addDaily(){

let balance=parseFloat(localStorage.getItem("balance"));

balance+=0.20;

localStorage.setItem("balance",balance.toFixed(2));

document.getElementById("balance").innerText=balance.toFixed(2);

alert("Daily bonus +$0.20");

}


function openFrame(url){

document.getElementById("dashboard").classList.add("hidden");

document.getElementById("offerView").classList.remove("hidden");

document.getElementById("frame").src=url;

}


function back(){

document.getElementById("offerView").classList.add("hidden");

document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("frame").src="";

}



function openGemi(){

openFrame("https://gemiwall.com/6987046ad95123da06330801/jockmmo1998/");

}


function openRevtoo(){

const user=localStorage.getItem("user");

openFrame(`https://revtoo.com/offerwall/${REVTOO_API_KEY}/${encodeURIComponent(user)}`);

}


function openClickwall(){

const user=localStorage.getItem("user");

openFrame(`https://clickwall.net/app/iframe/10621/${encodeURIComponent(user)}`);

}


function openMoustache(){

const user=localStorage.getItem("user");

openFrame(`https://offerwall.moustacheleads.com/offerwall?placement_id=ZVtFVRbd5DyrjELq&user_id=${encodeURIComponent(user)}&api_key=B6GScgjbtwvjAJRH4P5Fzhx4iXBk7I7L`);

}



showDashboard();

</script>

</body>
</html>
